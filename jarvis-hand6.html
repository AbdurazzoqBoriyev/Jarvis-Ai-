<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<style>
  html, body { margin: 0; height: 100%; background: #02070c; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #start {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: rgba(2, 7, 12, 0.35);
  }
  #start i {
    width: 92px; height: 92px; border-radius: 50%; border: 2px solid #3ee8ff;
    box-shadow: 0 0 30px rgba(62, 232, 255, 0.5), inset 0 0 20px rgba(62, 232, 255, 0.3);
    animation: pulse 1.6s ease-in-out infinite;
  }
  #dbg {
    position: fixed; left: 8px; right: 8px; bottom: 8px; font: 10px/1.5 ui-monospace, Menlo, monospace;
    color: #6f93a3; pointer-events: none; word-break: break-word;
  }
  @keyframes pulse { 0%,100% { transform: scale(0.9); opacity: .6 } 50% { transform: scale(1.1); opacity: 1 } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div id="start"><i></i></div>
<div id="dbg"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";

  /* ====== SOZLAMALAR ====== */
  var GEMINI_KEY = "";       // Gemini API key'ni qo'shtirnoq orasiga o'zing qo'yasan
  var MODEL = "gemini-2.5-flash";   // model nomi o'zgarsa (404 xato chiqsa), shu yerni almashtir
  var LANG = "en-US";        // ovozni tanish tili. O'zbekcha uchun: "uz-UZ"

  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var video = document.getElementById("cam");
  var W = 0, H = 0, dpr = 1;

  /* ====== diagnostika (tayyor bo'lgach DEBUG = false qilamiz) ====== */
  var DEBUG = true, dstate = {}, dbgEl = document.getElementById("dbg");
  function dbg(k, v) {
    if (dstate[k] === v) return;
    dstate[k] = v;
    if (!DEBUG) return;
    var s = []; for (var key in dstate) s.push(key + ": " + dstate[key]);
    dbgEl.textContent = s.join("  |  ");
  }
  dbg("secure", String(window.isSecureContext));
  dbg("iframe", String(window.top !== window));
  dbg("speech", (window.SpeechRecognition || window.webkitSpeechRecognition) ? "yes" : "NO");
  dbg("camAPI", (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? "yes" : "NO");

  /* ====== holat ====== */
  var mode = "idle";            // idle | listening | thinking | speaking
  var openT = 0.6;              // qo'lning ochiqligi 0 (musht) .. 1 (kaft)
  var openS = 0.6;              // silliqlangan
  var handSeen = false, handX = 0.5, handY = 0.5, lms = null;
  var started = false;

  /* ====== zarrachalar ====== */
  var N = 1500, hx = new Float32Array(N), hy = new Float32Array(N), hz = new Float32Array(N);
  var qx = new Float32Array(N), qy = new Float32Array(N), qz = new Float32Array(N), ph = new Float32Array(N);
  var GA = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < N; i++) {
    var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = GA * i;
    hx[i] = Math.cos(th) * r; hy[i] = y; hz[i] = Math.sin(th) * r;
    var a = Math.random() * 6.2832, b = Math.acos(2 * Math.random() - 1), L = 0.7 + Math.random() * 1.5;
    qx[i] = Math.sin(b) * Math.cos(a) * L; qy[i] = Math.sin(b) * Math.sin(a) * L; qz[i] = Math.cos(b) * L;
    ph[i] = Math.random() * 6.2832;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  resize(); window.addEventListener("resize", resize);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var cx = 0, cy = 0, ang = 0, last = 0, amp = 0;
  function frame(ts) {
    var t = ts / 1000, dt = Math.min(0.05, t - last); last = t;

    if (!handSeen) openT += (0.6 - openT) * 0.02;
    openS += (openT - openS) * 0.16;

    var tx = W / 2 + (handSeen ? (handX - 0.5) * W * 0.55 : 0);
    var ty = H / 2 + (handSeen ? (handY - 0.5) * H * 0.45 : 0);
    if (!cx) { cx = tx; cy = ty; }
    cx += (tx - cx) * 0.12; cy += (ty - cy) * 0.12;

    var ampT = 0.012;
    if (mode === "speaking") ampT = 0.04 + 0.06 * Math.abs(Math.sin(t * 9.1) * Math.sin(t * 3.7));
    else if (mode === "listening") ampT = 0.025 + 0.02 * Math.sin(t * 3);
    else if (mode === "thinking") ampT = 0.03;
    amp += (ampT - amp) * 0.12;
    ang += (mode === "thinking" ? 1.6 : 0.3 + (1 - openS) * 0.5) * dt;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);

    var R = Math.min(W, H) * 0.30;
    var tight = 1 - openS;                                  // musht = 1
    var radius = 0.2 + 0.8 * clamp(openS * 1.5, 0, 1);      // musht: kichik shar
    var scatter = clamp((openS - 0.45) / 0.55, 0, 1);       // kaft: yoyilish

    // glow
    var gr = R * (0.7 + scatter * 1.3);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
    g.addColorStop(0, "rgba(62,232,255," + (0.22 + tight * 0.5 + amp * 2).toFixed(3) + ")");
    g.addColorStop(0.5, "rgba(62,232,255," + (0.06 + tight * 0.08).toFixed(3) + ")");
    g.addColorStop(1, "rgba(62,232,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);

    // particles
    var ca = Math.cos(ang), sa = Math.sin(ang), ct = 0.94, st = 0.34;
    ctx.fillStyle = "#8af4ff";
    for (var j = 0; j < N; j++) {
      var X = hx[j] * radius + qx[j] * scatter;
      var Y = hy[j] * radius + qy[j] * scatter;
      var Z = hz[j] * radius + qz[j] * scatter;
      var w = 1 + amp * Math.sin(t * 5 + ph[j]) + (1 - scatter) * 0.015 * Math.sin(t * 2 + ph[j]);
      var x1 = (X * ca + Z * sa) * w, z1 = -X * sa + Z * ca;
      var y2 = (Y * ct - z1 * st) * w, z2 = Y * st + z1 * ct;
      var depth = clamp((z2 / (1 + scatter * 2) + 1) / 2, 0, 1);
      ctx.globalAlpha = (0.14 + 0.86 * depth) * (1 - scatter * 0.35);
      var sz = (0.7 + 1.5 * depth) * (1 + tight * 0.5);
      ctx.fillRect(cx + x1 * R, cy + y2 * R, sz, sz);
    }

    // core
    ctx.globalAlpha = 0.95; ctx.fillStyle = "#e9fdff";
    ctx.beginPath(); ctx.arc(cx, cy, 2.5 + tight * 5 + amp * 40, 0, 6.2832); ctx.fill();

    // listening ring
    if (mode === "listening" || mode === "thinking") {
      ctx.globalAlpha = mode === "thinking" ? 0.65 : 0.25 + 0.15 * Math.sin(t * 3);
      ctx.strokeStyle = "#3ee8ff"; ctx.lineWidth = 1.2;
      ctx.setLineDash([6, 10]); ctx.lineDashOffset = -t * 40;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.3 + scatter * R, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }

    // hand dots (feedback)
    if (handSeen && lms) {
      ctx.globalAlpha = 0.35; ctx.fillStyle = "#ffffff";
      for (var k = 0; k < lms.length; k++) {
        ctx.fillRect((1 - lms[k].x) * W - 1.5, lms[k].y * H - 1.5, 3, 3);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__setOpen = function (v) { openT = openS = v; };   // sinov uchun

  /* ====== qo'l: musht / kaft ====== */
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function openness(lm) {
    var palm = dist(lm[0], lm[9]) || 1e-6;
    var tips = [8, 12, 16, 20], s = 0;
    for (var i = 0; i < tips.length; i++) s += dist(lm[0], lm[tips[i]]);
    var ratio = s / tips.length / palm;          // musht ~1.0-1.3, kaft ~1.9-2.2
    return clamp((ratio - 1.2) / 0.7, 0, 1);
  }
  window.__openness = openness;

  function initHands() {
    if (typeof Hands === "undefined") { dbg("handlib", "NOT LOADED"); return; }
    dbg("handlib", "loading");
    var hands = new Hands({ locateFile: function (f) { return "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/" + f; } });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults(function (res) {
      var l = res.multiHandLandmarks && res.multiHandLandmarks[0];
      dbg("hand", l ? "seen" : "none");
      if (l) {
        handSeen = true; lms = l;
        openT = openness(l);
        handX = 1 - l[9].x; handY = l[9].y;
      } else { handSeen = false; lms = null; }
    });
    var busy = false;
    hands.initialize().then(function () { dbg("handlib", "ready"); }).catch(function (e) { dbg("handlib", "INIT FAILED " + (e && e.message || "")); });
    (function loop() {
      if (!busy && video.readyState >= 2) {
        busy = true;
        hands.send({ image: video }).catch(function (e) { dbg("handlib", "send error " + (e && e.message || "")); }).then(function () { busy = false; });
      }
      requestAnimationFrame(loop);
    })();
  }

  function initCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { dbg("cam", "no API here"); return; }
    dbg("cam", "asking");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 480, height: 360 }, audio: false })
      .then(function (stream) { dbg("cam", "on"); video.srcObject = stream; return video.play(); })
      .then(initHands)
      .catch(function (e) { dbg("cam", "ERROR " + (e && e.name)); });
  }

  /* ====== ovoz chiqarish ====== */
  var voice = null;
  function pickVoice() {
    var vs = speechSynthesis.getVoices(), best = null;
    for (var i = 0; i < vs.length; i++) {
      var v = vs[i], n = (v.name || "") + " " + (v.lang || "");
      if (!/^en/i.test(v.lang || "")) continue;
      if (/daniel|male|david|james|google uk english male/i.test(n)) return v;
      if (!best || /en-GB/i.test(v.lang)) best = v;
    }
    return best;
  }
  function speak(text, done) {
    mode = "speaking";
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      voice = voice || pickVoice();
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
      u.rate = 1; u.pitch = 0.85;
      u.onend = u.onerror = function () { mode = "idle"; if (done) done(); };
      speechSynthesis.speak(u);
    } catch (e) { mode = "idle"; if (done) done(); }
  }

  /* ====== miya ====== */
  var hist = [];
  function two(n) { return (n < 10 ? "0" : "") + n; }

  function brain(text) {
    var t = text.toLowerCase().trim();
    if (/^(hi|hello|hey|salom|assalomu|hay)\b/.test(t)) return "Hi boss, how are you?";
    if (/how are you|qalaysan|yaxshimisan|how's it going/.test(t)) return "I'm doing great, boss. Ready when you are.";
    if (/\b(i'm|i am|im)\s+(fine|good|great|well|ok|okay)\b|^(fine|good|great)\b|yaxshi/.test(t)) return "Glad to hear that, boss. How can I help you?";
    if (/what time|the time|soat/.test(t)) {
      var d = new Date(), h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
      return "It's " + ((h % 12) || 12) + ":" + two(d.getMinutes()) + " " + ap + ", boss.";
    }
    if (/what('s| is) the date|today's date|what day|sana|bugun/.test(t)) {
      return "Today is " + new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) + ", boss.";
    }
    if (/your name|who are you/.test(t)) return "I'm Jarvis, your personal assistant, boss.";
    if (/thank/.test(t)) return "Anytime, boss.";
    if (/\b(bye|goodbye)\b/.test(t)) return "Goodbye, boss. I'll be right here.";
    if (GEMINI_KEY) return askGemini(text);
    return "Sorry boss, my brain isn't connected yet. Once you give me a Gemini key, I'll be able to answer anything.";
  }

  function askGemini(q) {
    hist.push({ role: "user", parts: [{ text: q }] });
    return fetch("https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent", {
      method: "POST",
      headers: { "content-type": "application/json", "x-goog-api-key": GEMINI_KEY },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: "You are JARVIS, a voice assistant. Call the user 'boss'. Reply in the language the user spoke. Keep it to 1-2 short spoken sentences, no markdown, no lists, no emojis." }] },
        contents: hist.slice(-10),
        generationConfig: { maxOutputTokens: 220, temperature: 0.7 }
      })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) { dbg("brain", "HTTP " + r.status + " " + ((j.error && j.error.message) || "").slice(0, 90)); hist.pop(); return "Sorry boss, my brain returned an error."; }
        var c = j.candidates && j.candidates[0], a = c && c.content && c.content.parts && c.content.parts.map(function (p) { return p.text || ""; }).join(" ").trim();
        dbg("brain", a ? "ok" : "empty");
        if (!a) { hist.pop(); return "Sorry boss, I couldn't get an answer."; }
        hist.push({ role: "model", parts: [{ text: a }] });
        return a;
      });
    }).catch(function (e) { dbg("brain", "network " + (e && e.message || "")); hist.pop(); return "Sorry boss, I lost my connection."; });
  }

  /* ====== ovoz tanish (doim tinglab turadi) ====== */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, alive = false, busyTalk = false;

  function listen() {
    if (!SR || !alive || busyTalk) return;
    try {
      rec = new SR();
      rec.lang = LANG; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onstart = function () { dbg("mic", "listening"); if (mode === "idle") mode = "listening"; };
      rec.onresult = function (e) {
        var text = e.results[e.results.length - 1][0].transcript;
        if (!text || !text.trim()) return;
        dbg("heard", text);
        busyTalk = true; mode = "thinking";
        Promise.resolve(brain(text)).then(function (reply) {
          speak(reply, function () { busyTalk = false; setTimeout(listen, 250); });
        });
      };
      rec.onerror = function (e) {
        dbg("mic", "ERROR " + e.error);
        if (e.error === "not-allowed" || e.error === "service-not-allowed") { alive = false; mode = "idle"; speak("Boss, I need microphone permission."); }
      };
      rec.onend = function () { if (mode === "listening") mode = "idle"; if (alive && !busyTalk) setTimeout(listen, 200); };
      rec.start();
    } catch (e) { setTimeout(listen, 800); }
  }

  /* ====== ishga tushirish ====== */
  document.getElementById("start").addEventListener("click", function () {
    if (started) return;
    started = true;
    this.style.display = "none";
    initCamera();
    if (!SR) { speak("Sorry boss, this browser can't hear me. Please open me in Chrome."); return; }
    alive = true;
    busyTalk = true;
    speak("Jarvis online.", function () { busyTalk = false; listen(); });
  });
})();
</script>
</body>
</html>
